model_list:
  # Gemini — what the RAG app actually calls today (app/generate.py,
  # app/embeddings.py). The app still talks to Gemini directly for now;
  # routing it through this proxy instead is the next step, not yet done.
  - model_name: gemini-pro-latest
    litellm_params:
      model: gemini/gemini-pro-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

  # OpenAI models removed for now — they reference os.environ/OPENAI_API_KEY,
  # which was never confirmed to exist on the Railway litellm-proxy service
  # (only GEMINI_API_KEY, LITELLM_MASTER_KEY, LITELLM_DATABASE_URL, PORT were).
  # Locally OPENAI_API_KEY was set (docker-compose passes it from .env), so
  # this was never actually tested without it — a real candidate for the
  # silent-hang-on-Railway bug. Add them back with the var confirmed present
  # once the proxy is verified working on Gemini alone.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url temporarily disabled — diagnosing a Railway-only hang
  # (works fine locally against Postgres, hangs silently on Railway with
  # both private and public DB URLs). Testing whether the proxy boots at
  # all without a DB dependency, to isolate whether that's really the cause.
  # database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: false

litellm_settings:
  drop_params: true
