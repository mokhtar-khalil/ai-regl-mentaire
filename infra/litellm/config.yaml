model_list:
  # Gemini — what the RAG app actually calls today (app/generate.py,
  # app/embeddings.py). The app still talks to Gemini directly for now;
  # routing it through this proxy instead is the next step, not yet done.
  - model_name: gemini-pro-latest
    litellm_params:
      model: gemini/gemini-pro-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY

  # OpenAI — kept available for other apps sharing this gateway, or for
  # this app later if it needs a second provider. Requires OPENAI_API_KEY
  # to actually be set on the litellm-proxy service (confirm before
  # deploying — a referenced env var that doesn't exist crashed the proxy
  # silently on first boot, see git history for infra/litellm/config.yaml).
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Root cause found: BerriAI/litellm#17093 — the plain `litellm:main-stable`
  # image's wolfi base is missing the OpenSSL version Prisma's query engine
  # needs, so DB features fail with "No connected db" no matter the URL.
  # Fixed by switching the Dockerfile to litellm-database:main-stable.
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: false

litellm_settings:
  drop_params: true
