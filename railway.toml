# Railway service config for the FastAPI API. Deploy this repo as one
# Railway service using this file (root Dockerfile), then add Postgres,
# Qdrant, and LiteLLM as separate services in the same project (Postgres:
# Railway's own plugin; Qdrant + LiteLLM: "Deploy from Docker image" with
# qdrant/qdrant:latest and ghcr.io/berriai/litellm:main-stable respectively).
#
# The frontend lives on Vercel, a different platform — so unlike an
# all-Railway setup, this API needs a PUBLIC domain for Vercel to reach it
# (Railway's free *.up.railway.app works fine to start; Settings > Networking
# > Generate Domain on this service). Internal Railway networking
# (*.railway.internal) only works between services inside the same Railway
# project, so it applies to api <-> qdrant/litellm, not api <-> Vercel.
#
# Required env vars on the api service:
#   GEMINI_API_KEY   — same key used locally
#   QDRANT_URL       — the Qdrant service's internal Railway URL (http://<service>.railway.internal:6333)
#
# Required env var on the Vercel project:
#   RAG_API_URL      — this service's public Railway domain
#
# After the qdrant service is up, run the ingestion scripts once against it
# (scripts/ingest*.py with QDRANT_URL pointed at the deployed instance) to
# populate the index — the API serves queries, it doesn't ingest documents.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
